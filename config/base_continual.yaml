_target_: diffusion_policy.workspace.train_diffusion_transformer_hybrid_workspace.TrainDiffusionTransformerHybridWorkspace

name: train_diffusion_transformer_hybrid
task_name: continual
exp_name: default
output_dir: outputs/${task_name}/${now:%Y.%m.%d}/${now:%H.%M.%S}

# Constants & Setup
n_action_steps: 8
n_latency_steps: 0
n_obs_steps: 2
dataset_obs_steps: 2
horizon: 10
keypoint_visible_rate: 1.0
obs_as_cond: true
past_action_visible: false

# Checkpoint Configuration
checkpoint:
  save_last_ckpt: true
  save_last_snapshot: false
  topk:
    format_str: epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt
    k: 5
    mode: max
    monitor_key: test_mean_score

# Logging Configuration
logging:
  group: null
  id: null
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  project: diffusion_policy_continual
  resume: true
  tags:
    - train_diffusion_transformer_hybrid
    - default

# Multi Run Configuration
multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

# Optimizer Configuration
optimizer:
  betas:
    - 0.9
    - 0.95
  learning_rate: 0.0001
  obs_encoder_weight_decay: 1.0e-06
  transformer_weight_decay: 0.001

# EMA (Exponential Moving Average)
ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  inv_gamma: 1.0
  max_value: 0.9999
  min_value: 0.0
  power: 0.75
  update_after_step: 0

# Policy Model Configuration
policy:
  _target_: diffusion_policy.policy.diffusion_transformer_hybrid_image_policy.DiffusionTransformerHybridImagePolicy
  causal_attn: true
  crop_shape:
    - 80 
    - 80 
  eval_fixed_crop: true
  horizon: 10
  n_fixed_tasks: 2
  n_tasks: 3
  task_id: -1
  n_action_steps: 8
  n_cond_layers: 0
  n_emb: 256
  n_head: 4
  n_layer: 8
  n_obs_steps: 2
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddpm.DDPMScheduler
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    beta_start: 0.0001
    clip_sample: true
    num_train_timesteps: 100
    prediction_type: epsilon
    variance_type: fixed_small
  num_inference_steps: 100
  obs_as_cond: true
  obs_encoder_group_norm: true
  p_drop_attn: 0.3
  p_drop_emb: 0.0
  shape_meta:
    action:
      shape:
        - 7
    obs:
      agentview_image:
        shape:
          - 3
          - 84
          - 84
        type: rgb
      robot0_eef_pos:
        shape:
          - 3
      robot0_eef_quat:
        shape:
          - 4
      robot0_eye_in_hand_image:
        shape:
          - 3
          - 84
          - 84
        type: rgb
      robot0_gripper_qpos:
        shape:
          - 2
  time_as_cond: true
  use_continual_moe: true
  num_experts_per_task: 8
  experts_per_task_active: 2
  num_tasks_for_continual: 3 

# Dataloader Configuration
dataloader:
  batch_size: 64
  num_workers: 4
  persistent_workers: false
  pin_memory: true
  shuffle: true

val_dataloader:
  batch_size: 64
  num_workers: 4
  persistent_workers: false
  pin_memory: true
  shuffle: false

# Training Loop Configuration
training:
  checkpoint_every: 50
  debug: true
  device: cuda:0
  gradient_accumulate_every: 1
  lr_scheduler: cosine
  lr_warmup_steps: 1000
  max_train_steps: null
  max_val_steps: null
  num_epochs: 500
  resume: true
  rollout_every: 50
  sample_every: 5
  seed: 42
  tqdm_interval_sec: 1.0
  use_ema: true
  val_every: 1

# Tasks and Pretraining
task_num: 3
task0: !include "config/tasks/can.yaml"
task1: !include "config/tasks/lift.yaml"
task2: !include "config/tasks/square.yaml"

pretrained_path: null
