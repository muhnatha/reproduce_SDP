"""
Base Configuration for Continual Learning Experiments (Can → Lift → Square)

This configuration sets up the training pipeline for continual learning
as described in the paper's Appendix C.1 and Table 3.

Key Paper Settings (Appendix C.1):
- n_layer: 8 (not 12 as in multi-task)
- n_emb: 256 (not 512)
- n_head: 4
- num_experts_per_task: 8 (new experts per task)
- experts_per_task_active: 2 (experts to activate per task)
- num_tasks_for_continual: 3 (Can, Lift, Square stages)
- training.num_epochs: 500 (epochs per stage)
- training.rollout_every: 50 (evaluate every 50 epochs)
- training.learning_rate: 0.0001

Task Order:
- Stage 1: Train on Can (task 0) → Evaluate on Can
- Stage 2: Add Lift (task 1), freeze Can, train on Lift → Evaluate on Can+Lift
- Stage 3: Add Square (task 2), freeze Can+Lift, train on Square → Evaluate on Can+Lift+Square

Use Case:
python train_continual.py
"""

# Workspace
_target_: diffusion_policy.workspace.train_continual_workspace.TrainContinualWorkspace

# Experiment name and logging
exp_name: continual_learning_can_lift_square
group: null
id: null
mode: offline
project: diffusion_policy_debug
tags:
  - train_diffusion_transformer_hybrid
  - continual_learning
  - can_lift_square
  - paper_app_c1

# Logging configuration
logging:
  mode: offline
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  project: diffusion_policy_debug
  offline_dir: ./outputs/${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

# Output configuration
output_dir: data/outputs/${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

# Checkpoint configuration
checkpoint:
  save_last_ckpt: true
  save_last_snapshot: false
  topk:
    format_str: epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt
    k: 5
    mode: max
    monitor_key: test_mean_score

# Device configuration
device: cuda:0

# Dataset configuration
dataset_obs_steps: 2

# EMA (Exponential Moving Average) configuration
use_ema: true

# Trajectory configuration
horizon: 10
keypoint_visible_rate: 1.0

# Action and observation steps
n_action_steps: 8
n_latency_steps: 0
n_obs_steps: 2

# Observation conditioning
obs_as_cond: true
n_cond_layers: 0

# Task conditioning
time_as_cond: true

# Past action
past_action_visible: false

# Policy configuration
policy:
  _target_: diffusion_policy.policy.diffusion_transformer_hybrid_image_policy.DiffusionTransformerHybridImagePolicy
  
  # MODIFIED: Enable continual learning mode
  use_continual_moe: true
  num_experts_per_task: 8
  experts_per_task_active: 2
  num_tasks_for_continual: 3

  # Model architecture (from paper Appendix C.1)
  n_layer: 8
  n_emb: 256
  n_head: 4
  n_cond_layers: 0
  p_drop_emb: 0.0
  p_drop_attn: 0.3
  
  # Observation encoder settings
  obs_encoder_group_norm: false
  eval_fixed_crop: true
  
  # Image cropping
  crop_shape:
    - 80
    - 80
  
  # Common shape meta
  shape_meta:
    action:
      shape:
      - 7
    obs:
      agentview_image:
        shape:
        - 3
        - 84
        - 84
        type: rgb
      robot0_eef_pos:
        shape:
        - 3
      robot0_eef_quat:
        shape:
        - 4
      robot0_eye_in_hand_image:
        shape:
        - 3
        - 84
        - 84
        type: rgb
      robot0_gripper_qpos:
        shape:
        - 2

# Dataloader configuration
dataloader:
  batch_size: 64
  num_workers: 8
  persistent_workers: true
  pin_memory: true
  shuffle: true

# Validation dataloader
val_dataloader:
  batch_size: 64
  num_workers: 4
  persistent_workers: false
  pin_memory: true
  shuffle: false

# Optimizer configuration
optimizer:
  learning_rate: 0.0001
  betas:
  - 0.9
  - 0.95
  obs_encoder_weight_decay: 0.000001
  transformer_weight_decay: 0.001

# Training configuration
training:
  seed: 42
  checkpoint_every: 1
  max_train_steps: null
  max_val_steps: null
  debug: false
  use_ema: true
  lr_scheduler: cosine
  lr_warmup_steps: 100
  rollout_every: 50
  num_epochs: 500
  resume: true

# Task-specific configurations
# Each task uses its own dataset and env_runner
# task0 = Can, task1 = Lift, task2 = Square

# Task 0: Can (first task to train)
task0:
  abs_action: false
  dataset:
    _target_: diffusion_policy.dataset.robomimic_replay_image_dataset.RobomimicReplayImageDataset
    abs_action: false
    dataset_path: datasets/can/ph/image.hdf5
    horizon: 10
    n_obs_steps: 2
    pad_after: 7
    pad_before: 1
    rotation_rep: rotation_6d
    seed: 42
    shape_meta:
      action:
        shape:
        - 7
      obs:
        agentview_image:
          shape:
          - 3
          - 84
          - 84
          type: rgb
        robot0_eef_pos:
          shape:
          - 3
        robot0_eef_quat:
          shape:
          - 4
        robot0_eye_in_hand_image:
          shape:
            - 3
            - 84
            - 84
            type: rgb
        robot0_gripper_qpos:
          shape:
            - 2
    use_cache: true
    val_ratio: 0.02
  dataset_path: datasets/can/ph/image.hdf5
  env_runner:
    _target_: diffusion_policy.env_runner.robomimic_image_runner.RobomimicImageRunner
    abs_action: false
    crf: 22
    dataset_path: datasets/can/ph/image.hdf5
    fps: 10
    max_steps: 400
    n_action_steps: 8
    n_envs: 8
    n_obs_steps: 2
    n_test: 50
    n_test_vis: 4
    n_train: 6
    n_train_vis: 2
    past_action: false
    render_obs_key: agentview_image
    shape_meta:
      action:
        shape:
        - 7
      obs:
        agentview_image:
          shape:
            - 3
          - 84
          - 84
          type: rgb
        robot0_eef_pos:
          shape:
            - 3
        robot0_eef_quat:
          shape:
            - 4
        robot0_eye_in_hand_image:
          shape:
            - 3
            - 84
            - 84
            type: rgb
        robot0_gripper_qpos:
          shape:
            - 2
    test_start_seed: 100000
    tqdm_interval_sec: 1.0
    train_start_idx: 0
  name: can
  shape_meta:
    action:
        shape:
      - 7
    obs:
      agentview_image:
        shape:
          - 3
          - 84
          - 84
          type: rgb
      robot0_eef_pos:
        shape:
          - 3
      robot0_eef_quat:
        shape:
          - 4
      robot0_eye_in_hand_image:
